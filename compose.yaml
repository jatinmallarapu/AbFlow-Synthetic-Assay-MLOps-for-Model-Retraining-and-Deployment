services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: abflow
      POSTGRES_PASSWORD: local-demo
      POSTGRES_DB: abflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://abflow:local-demo@db:5432/abflow
    ports:
      - "127.0.0.1:8000:8000"
